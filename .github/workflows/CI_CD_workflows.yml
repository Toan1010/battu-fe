name: CI/CD Pipeline workflows

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  # Job 1: Build & Test ứng dụng React/Node.js
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Tự động cache dependencies để tăng tốc độ build

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build project
        run: npm run build

  # Job 2: Build Docker Image (Kiểm tra Dockerfile có build thành công hay không)
  build-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
